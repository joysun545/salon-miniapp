name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          node -e "for (const file of ['app.json','project.config.json']) JSON.parse(require('node:fs').readFileSync(file))"
